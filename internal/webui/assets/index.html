<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="token" content="{{.Token}}">
  <title>bilibili-txt</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div id="healthbar" hidden></div>
  <header class="app-header">
    <input id="url" type="text" autofocus autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false"
           placeholder="粘贴 B 站链接，回车转换（无需引号）">
    <button id="go" type="button">转换</button>
    <div id="urlerr" hidden></div>
  </header>
  <main class="panels">
    <aside id="logs" aria-label="日志">
      <div id="logs-body"></div>
    </aside>
    <section id="reader" aria-label="文稿">
      <div id="reader-status" hidden></div>
      <div id="reader-content" class="empty">粘贴链接开始转换，完成后的字幕显示在这里</div>
    </section>
    <aside id="history" aria-label="最近转换">
      <h2 class="history-title">最近转换</h2>
      <div id="history-list"></div>
    </aside>
  </main>
</body>
</html>
