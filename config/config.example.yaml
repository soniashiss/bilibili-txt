# =============================================================================
# bilibili-txt 配置文件示例
#
# 用法：
#   cp config/config.example.yaml config/config.yaml
#   然后按需修改下面的值。
#
# 加载位置（可选）：<当前执行目录>/config/config.yaml
#   - 文件不存在时静默使用内置默认值，不报错。
#   - 也可用隐藏参数 --config <path> 指定其它路径（测试/调试用）。
#
# 优先级：一次性 CLI flag（如 -o/--output-dir）> 本文件 > 内置默认值。
#          其余稳态偏好（format / model / debug / logging.* / binaries.* 等）只在本文件配置，
#          没有对应 CLI flag；binaries.* 则是本文件或 $PATH 二选一。
#
# 不需要的字段整段删掉或留空即可；留空字符串 = “未指定”，回退默认/$PATH。
# =============================================================================

# 文字稿输出目录（相对路径按当前执行目录解析；支持 ~ 家目录）。
# 内置默认：<当前执行目录>/transcripts
output_dir: ./bilibili-transcripts

# 输出格式：txt | md | srt   （内置默认 txt）
format: txt

# whisper.cpp 模型文件路径（仅在走 ASR 分支时需要；有官方 CC 字幕时用不到）。
# 内置默认：~/.local/share/whisper/ggml-large-v3-turbo.bin
model: ~/.local/share/whisper/ggml-large-v3-turbo.bin

logging:
  # 日志级别：debug | info | warn | error；留空 = info
  level: info
  # 日志格式：text | json；留空 = text
  format: text
  # 主日志额外落盘文件；留空 = 只输出到 stderr
  file: ""
  # debug 落盘路径；留空且 debug: true 时自动落到 ./logs/<bvid>-<时间戳>.log
  debug_file: ""

# 打开 debug 模式：生成外部命令 stderr 全量日志文件，
# 且 logging.level 留空时自动提升到 debug。true / false，默认 false。
# 没有 CLI flag，需要排障时把这里改成 true 即可。
debug: false

# 跳过依赖预检（yt-dlp / ffmpeg / whisper / 模型 / 输出目录）。
# 默认 false：预检失败会给出友好的安装提示。
# 确知工具链没问题、或排障时可设 true（此时建议同时把 debug 设为 true，
# 否则外部命令报错时没有 stderr 日志可查）。
skip_preflight: false

# 外部可执行文件路径。
#   留空 / 缺失 = 在 $PATH 中查找；
#   填非空路径  = 直接使用（文件不存在或不可执行会直接报错，不会回退 $PATH）。
# 没有 CLI flag 对应，只能在这里配置或依赖 $PATH。
binaries:
  ytdlp: ""         # 例：/opt/homebrew/bin/yt-dlp
  ffmpeg: ""        # 例：/opt/homebrew/bin/ffmpeg
  whisper_cli: ""   # 例：/opt/homebrew/bin/whisper-cli

naming:
  # 输出文件已存在时的策略：ask | overwrite | skip | abort
  #   ask       —— 终端交互询问（非 TTY 或 --no-interactive 时降级为 abort）
  #   overwrite —— 直接覆盖
  #   skip      —— 跳过本次（当作已缓存，退出码 0）
  #   abort     —— 直接失败（退出码 3）
  # CLI 的 --overwrite / --skip 会覆盖此项；内置默认 ask。
  on_conflict: ask

# 登录/授权：默认从浏览器读取 Bilibili 登录 cookie，走 yt-dlp 的
#   --cookies-from-browser <BROWSER>
# 机制。默认 chrome —— macOS 首次执行时钥匙串会弹一次授权框，选“始终允许”即可。
# 支持的 BROWSER 值以 yt-dlp 为准，常见为 chrome | chromium | edge | firefox |
# brave | opera | safari | vivaldi | whale；带 profile 时可写 "chrome:Default"、
# "chrome:Profile 1" 等。
# 显式关闭登录（不走浏览器 cookie）时填 none，此时 yt-dlp 只能拉不需要登录的公开视频。
# 留空 = 使用内置默认（chrome）。
auth:
  cookies_from_browser: chrome

# 本地 Web 界面配置（仅无参数启动、进入界面模式时生效；命令行下载流程不读取本段）。
server:
  port: 0            # 界面模式监听端口；0 = 随机端口。仅无参数启动界面时生效
  open_browser: true # 启动后自动打开浏览器
  chrome_app: true   # macOS 优先用 Chrome --app 独立窗口打开
